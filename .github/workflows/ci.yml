# Tests run on every push and pull request. The page is published to GitHub Pages only
# from main, and only when both the unit tests and the browser tests passed.
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  e2e:
    name: browser tests (headless Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright outside the project (it has no dependencies)
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright
          npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright

  deploy:
    name: deploy to GitHub Pages
    needs: [unit, e2e] # skipped if either failed
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (only what the browser needs)
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css icons lab src _site/
          # Lets open pages notice a newer deploy: the build id goes into the page and build.json.
          sed -i "s|<meta name=\"build\" content=\"\">|<meta name=\"build\" content=\"$GITHUB_SHA\">|" _site/index.html
          grep -q "content=\"$GITHUB_SHA\"" _site/index.html
          printf '{"build":"%s"}\n' "$GITHUB_SHA" > _site/build.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
