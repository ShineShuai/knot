# Tests run on every push and pull request. The page is published to GitHub Pages (the beta
# copy) only from main, and only when both the unit tests and the browser tests passed; a smoke
# test then loads the deployed page. Production (Cloudflare) is release.yml, from a tag.
# One-time setup: repository Settings > Pages > Build and deployment > Source: GitHub Actions.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:soft # LEGACY-CURVES

  e2e:
    name: browser tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Chromium runs everything and decides. Firefox and WebKit (Safari's engine) run the engine
    # suite (the single-page checks, see test/e2e/browsers.mjs) and do not block a deploy yet:
    # once they have been green for a while, delete the next line to make them count too.
    continue-on-error: ${{ matrix.browser != 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright outside the project (it has no dependencies)
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install playwright
          npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/pw/node_modules/playwright
          E2E_BROWSER: ${{ matrix.browser }}

  deploy:
    name: deploy to GitHub Pages
    needs: [unit, e2e] # skipped if either failed
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (only what the browser needs), stamped as beta
        run: tools/assemble.sh _site "$GITHUB_SHA" beta
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: live smoke (beta)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/playwright
      - name: Wait until the new build is served
        run: tools/wait-for-build.sh "$SITE" "$GITHUB_SHA"
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
      - name: The live suite (E2E_BASE_URL selects it)
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}
